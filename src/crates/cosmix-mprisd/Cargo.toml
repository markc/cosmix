[package]
name = "cosmix-mprisd"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Event-driven MPRIS2 media-player citizen for Cosmix"

[lib]
name = "cosmix_mprisd"
path = "src/lib.rs"

[[bin]]
name = "cosmix-mprisd"
path = "src/main.rs"
required-features = ["cosmix"]

[features]
default = ["cosmix"]
cosmix = [
    "dep:anyhow",
    "dep:clap",
    "dep:cosmix_buildinfo",
    "dep:cosmix_bus",
    "dep:cosmix_client",
    "dep:cosmix_config",
    "dep:cosmix_props_core",
    "cosmix_props_core/bus",
    "dep:futures-util",
    "dep:serde_json",
    "dep:tokio",
    "dep:zbus",
]

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../cosmix-lib-buildinfo", optional = true }
cosmix_bus = { package = "cosmix-lib-bus", path = "../cosmix-lib-bus", optional = true }
cosmix_client = { package = "cosmix-lib-client", path = "../cosmix-lib-client", optional = true }
cosmix_config = { package = "cosmix-lib-config", path = "../cosmix-lib-config", features = ["client-helpers"], optional = true }
cosmix_props_core = { package = "cosmix-lib-props-core", path = "../cosmix-lib-props-core", default-features = false, optional = true }
futures-util = { version = "0.3", optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["test-util"] }
zbus = { version = "5.18", default-features = false, features = ["tokio"], optional = true }

[build-dependencies]
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../cosmix-lib-buildinfo" }
