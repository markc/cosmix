[package]
name = "cosmix-midicomp"
version = "0.3.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
description = "SMF (Standard MIDI File) ⇄ plain-text converter — an MIT Rust port of midicomp (tolerant SMF reader; midly-backed writer). Library core + thin CLI."

[lib]
name = "cosmix_midicomp"
path = "src/lib.rs"

[[bin]]
name = "cosmix-midicomp"
path = "src/main.rs"
required-features = ["cli"]

[features]
# The CLI binary; library consumers take `default-features = false` and skip clap.
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
# SMF (Standard MIDI File) read/write. The encode/decode cores are built on
# this rather than a hand-rolled binary codec.
midly = "0.5"
clap = { workspace = true, optional = true }   # CLI flags (derive) — `cli` feature only
anyhow.workspace = true
