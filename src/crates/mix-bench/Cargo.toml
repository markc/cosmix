[package]
name = "mix-bench"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "mix-bench"
path = "src/main.rs"

[dependencies]
# `--version` build provenance (cosmix_buildinfo::exit_on_version!).
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../cosmix-lib-buildinfo" }
cosmix-lib-mix = { path = "../cosmix-lib-mix", features = ["json", "regex", "toml", "datetime", "url", "crypto", "sqlite", "tokio-sleep"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }

[build-dependencies]
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../cosmix-lib-buildinfo" }
