[package]
name = "cosmix-agentd"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent daemon — exposes LLM agent loops with pluggable tools as an Bus port"

[[bin]]
name = "cosmix-agentd"
path = "src/main.rs"

[dependencies]
cosmix_agent = { package = "cosmix-lib-agent", path = "../cosmix-lib-agent" }
cosmix_bus = { package = "cosmix-lib-bus", path = "../cosmix-lib-bus" }
cosmix_config = { package = "cosmix-lib-config", path = "../cosmix-lib-config" }
cosmix_daemon = { package = "cosmix-lib-daemon", path = "../cosmix-lib-daemon" }
cosmix_log = { package = "cosmix-lib-log", path = "../cosmix-lib-log" }
cosmix_llm = { package = "cosmix-lib-llm", path = "../cosmix-lib-llm" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
mimalloc.workspace = true
