[package]
name = "cosmix-foreman"
version = "0.24.10"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "foreman"
path = "src/main.rs"

[[bin]]
name = "foreman-stream-fixture"
path = "src/bin/foreman-stream-fixture.rs"

[dependencies]
sha2 = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
clap = { workspace = true }
rmcp = { version = "3", features = ["server", "transport-io", "macros", "schemars"] }
rusqlite = { workspace = true }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
toml_edit = { workspace = true }
tokio = { workspace = true }
cosmix-lib-mix = { path = "../cosmix-lib-mix" }

[dev-dependencies]
# Integration tests fabricate hostile ledger rows (dead-pid reservations)
# the public API refuses to create.
rusqlite = { workspace = true }
