[package]
name = "cosmix-indexd"
version = "0.9.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Semantic indexing + vector storage daemon using nomic-embed-text via candle"

[[bin]]
name = "cosmix-indexd"
path = "src/main.rs"

[dependencies]
cosmix_daemon = { package = "cosmix-lib-daemon", path = "../cosmix-lib-daemon" }
cosmix_log = { package = "cosmix-lib-log", path = "../cosmix-lib-log", features = ["bus-handlers"] }
cosmix_config = { package = "cosmix-lib-config", path = "../cosmix-lib-config", features = ["client-helpers"] }
cosmix_client = { package = "cosmix-lib-client", path = "../cosmix-lib-client" }
cosmix_bus = { package = "cosmix-lib-bus", path = "../cosmix-lib-bus" }
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../cosmix-lib-buildinfo" }
cosmix_props = { package = "cosmix-lib-props-store", path = "../cosmix-lib-props-store" }
cosmix_log_props = { package = "cosmix-lib-log-props", path = "../cosmix-lib-log-props" }
chrono.workspace = true
anyhow.workspace = true
clap = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
libc.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
sqlite-vec = "0.1.8-alpha.1"
candle-core = { git = "https://github.com/huggingface/candle" }
candle-nn = { git = "https://github.com/huggingface/candle" }
candle-transformers = { git = "https://github.com/huggingface/candle" }
hf-hub = { version = "0.4", default-features = false, features = ["rustls-tls", "ureq"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[build-dependencies]
# Captures cos HEAD sha + build time (version-discovery contract).
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../cosmix-lib-buildinfo" }
