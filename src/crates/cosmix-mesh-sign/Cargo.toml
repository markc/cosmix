[package]
name = "cosmix-mesh-sign"
version = "0.8.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cosmix-mesh-sign"
path = "src/main.rs"

[dependencies]
# `--version` build provenance (cosmix_buildinfo::exit_on_version!).
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../cosmix-lib-buildinfo" }
# Core (mesh-free) types + the one shared canonicaliser + verify — the
# signer MUST share this with the verifier (noded, 1b-c) so they cannot
# disagree on canonical bytes (SPEC 13 §6). default-features = false keeps
# the Bus/SPEC-12 integration out of the signer.
cosmix-lib-mesh-trust = { path = "../cosmix-lib-mesh-trust", default-features = false }
# Reads the one authored inventory.mix through the SAME strict-data parser
# the Mix tooling uses (cosmix_config::load_mix_data).
cosmix-lib-config = { path = "../cosmix-lib-config" }
cosmix-lib-wg = { path = "../cosmix-lib-wg" }
libc = { workspace = true }

ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand = { workspace = true }
rusqlite = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }

[build-dependencies]
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../cosmix-lib-buildinfo" }
