[package]
name = "cosmix-filesd"
version = "0.8.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Files-as-truth markdown corpus daemon — watches a corpus tree, maintains a rebuildable SQLite index, and serves it over Bus (filesd.* verbs + props)."

[[bin]]
name = "cosmix-filesd"
path = "src/main.rs"

# S4: an Bus citizen around the cosmix-lib-files reconcile engine. A single
# index-writer thread owns the Store (rusqlite Connection is Send+!Sync); the
# notify watcher, the periodic reconcile backstop, and the Bus command loop all
# funnel WriterCmds to it. Verbs: filesd.{list,read,save,move,delete,search,changes}
# + read-only filesd.props.{get,list,describe}. filesd.save is the sole id-minting
# write path. indexd semantic push arrives in S5. S7 adds per-corpus config-from-file
# (`serve -c <corpus>.conf.mix`) + a configurable Bus service name (`filesd-<corpus>`),
# so one daemon instance per corpus runs under a systemd template `cosmix-filesd@.service`.
# The SPEC-12 grants namespace (D7) is DEFERRED to land with the webd surface (S6) —
# grants authorize the delegated web path; the trusted on-node `send` path is bounded by
# the WireGuard /24 trust domain. mds CAS attachments also deferred to a later slice.

[dependencies]
cosmix_files = { package = "cosmix-lib-files", path = "../cosmix-lib-files", features = ["sqlite"] }
cosmix_client = { package = "cosmix-lib-client", path = "../cosmix-lib-client" }
cosmix_bus = { package = "cosmix-lib-bus", path = "../cosmix-lib-bus" }
cosmix_config = { package = "cosmix-lib-config", path = "../cosmix-lib-config", features = ["client-helpers"] }
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../cosmix-lib-buildinfo" }
cosmix_props_core = { package = "cosmix-lib-props-core", path = "../cosmix-lib-props-core", features = ["bus"] }
tokio = { workspace = true }
notify = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../cosmix-lib-buildinfo" }
