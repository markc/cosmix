[package]
name = "cosmix-song"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "song.v1 document model — tracks/notes with tick timing, SMF import/export, JSON + binary persistence, snapshot undo. Lifted from miditui (MIT, Max Woolf) for the studio sequencer line; pure Rust, no cosmix deps (sibling of cosmix-mixer-schema). Design: ~/.cmctl/_doc/2026-07-18-midi-sequencer-design.md."

[lib]
name = "cosmix_song"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Tolerant SMF reader (same dep cosmix-midicomp uses). The write side is a
# hand-rolled Format-1 byte writer carried over from miditui — no midly there.
midly = "0.5"
# Binary song format. Field sequence matches miditui's `.oxm` serde shape,
# so autosaves written by miditui load here.
bincode = "1.3"
# .asc (SMF-as-text) import/export — the midicomp converter cores, sans CLI.
cosmix_midicomp = { package = "cosmix-midicomp", path = "../cosmix-midicomp", default-features = false }
