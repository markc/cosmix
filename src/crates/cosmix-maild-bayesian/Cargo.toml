[package]
name = "cosmix-maild-bayesian"
version = "0.7.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cosmix_maild_bayesian"
path = "src/lib.rs"

[[bin]]
name = "cosmix-maild-bayesian-migrate"
path = "src/bin/cosmix-maild-bayesian-migrate.rs"

[features]
default = ["core"]
core = []
cosmix = ["dep:cosmix-lib-bus", "dep:cosmix-lib-client"]

[dependencies]
# `--version` build provenance (cosmix_buildinfo::exit_on_version!).
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../cosmix-lib-buildinfo" }
cosmix-maild-rules = { path = "../cosmix-maild-rules" }
spamlite = { git = "https://github.com/markc/spamlite", rev = "98f91a9d8142f92ae89ba4f070a165ce86fa5e8d", default-features = false }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
thiserror = "2"
chrono = { workspace = true }

cosmix-lib-bus = { path = "../cosmix-lib-bus", optional = true }
cosmix-lib-client = { path = "../cosmix-lib-client", features = ["native"], optional = true }

[build-dependencies]
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../cosmix-lib-buildinfo" }
