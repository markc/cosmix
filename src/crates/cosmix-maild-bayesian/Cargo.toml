[package]
name = "cosmix-maild-bayesian"
version = "0.6.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cosmix_maild_bayesian"
path = "src/lib.rs"

[[bin]]
name = "cosmix-maild-bayesian-migrate"
path = "src/bin/cosmix-maild-bayesian-migrate.rs"

[features]
default = ["core"]
core = []
cosmix = ["dep:cosmix-lib-bus", "dep:cosmix-lib-client"]

[dependencies]
cosmix-maild-rules = { path = "../cosmix-maild-rules" }
spamlite = { git = "https://github.com/markc/spamlite", rev = "c288fe94f14abea4fb734a24901e3fabb65eec9b", default-features = false }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
thiserror = "2"
chrono = { workspace = true }

cosmix-lib-bus = { path = "../cosmix-lib-bus", optional = true }
cosmix-lib-client = { path = "../cosmix-lib-client", features = ["native"], optional = true }
