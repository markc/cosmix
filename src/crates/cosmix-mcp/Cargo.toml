[package]
name = "cosmix-mcp"
version = "0.7.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server bridging Claude Code to the cosmix appmesh"

[[bin]]
name = "cosmix-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3", features = ["server", "transport-io", "macros", "schemars"] }
cosmix_client = { package = "cosmix-lib-client", path = "../cosmix-lib-client" }
cosmix_bus = { package = "cosmix-lib-bus", path = "../cosmix-lib-bus" }
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../cosmix-lib-buildinfo" }
cosmix_skills = { package = "cosmix-lib-skills", path = "../cosmix-lib-skills" }
cosmix_config = { package = "cosmix-lib-config", path = "../cosmix-lib-config", features = ["client-helpers"] }
cosmix_log = { package = "cosmix-lib-log", path = "../cosmix-lib-log" }
serde_json.workspace = true
serde.workspace = true
schemars = "1"
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
glob = "0.3"
libc.workspace = true
cosmix-lib-mix = { path = "../cosmix-lib-mix", features = ["json", "regex", "toml", "datetime", "url", "crypto"] }

[dev-dependencies]
rmcp = { version = "3", features = ["client", "transport-io"] }
tempfile = "3"
jsonschema = { version = "0.58", default-features = false }

[build-dependencies]
# Captures cos HEAD sha + build time for --version.
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../cosmix-lib-buildinfo" }
