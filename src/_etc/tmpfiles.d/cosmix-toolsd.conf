# tmpfiles.d — runtime dir + pre-created lock file for the toolsd drain lock.
#
# NOT a systemd RuntimeDirectory= (that is ref-counted to the unit lifetime and would
# vanish between oneshot drains). tmpfiles creates these once at boot and leaves them.
#
# The DIRECTORY is root-owned 0755 so cosmix-toolsd cannot unlink/recreate the lock inode
# out from under a holder. The lock FILE is pre-created and owned by cosmix-toolsd so
# flock can open it; if it is ever absent, flock -n in the root-owned dir cannot create it
# and the drain fails CLOSED (it never runs unserialized).
d /run/cosmix-toolsd 0755 root root -
f /run/cosmix-toolsd/drain.lock 0644 cosmix-toolsd cosmix-toolsd -
