# /etc/sysusers.d/cosmix-nodeexport.conf
# Cosmix node_exporter — standalone foreign-host identity fragment.
# Hand-maintained from Appendix A of cosmix-daemon-identity v1.4.1
# (row: cosmix-nodeexport, UID/GID 514). Not codegen output — there
# is no generator that emits Appendix A subsets. If SPEC-10 amends
# the UID 514 row, edit this file by hand and re-deploy.
#
# Source-of-truth path: src/_etc/sysusers/cosmix-nodeexport-foreign.conf
# in the cos workspace (markc/cos). DO NOT EDIT on the host; edit the
# workspace copy, commit, and re-run the nodeexport bringup script
# (currently lives in the private control repo's `_bin/`;
# per umbrella plan step 8 it may move to cos-side `_bin/` later) to
# redeploy.
#
# Single-row variant for hosts that are NOT cosmix-bus mesh citizens
# (no cosmix-noded, no full SPEC-10 daemon family). Sister file to the
# citizen-side src/_etc/sysusers/cosmix.conf — both materialise the same
# u cosmix-nodeexport 514 row, so a host that later elevates from
# foreign to citizen sees no UID drift. The two files live at different
# paths on the host (citizen installs /usr/lib/sysusers.d/cosmix.conf;
# foreign installs /etc/sysusers.d/cosmix-nodeexport.conf), so they
# coexist without precedence conflict. When SPEC-10 amends UID 514,
# edit BOTH workspace files in the same commit.

#Type Name              ID   GECOS                                Home           Shell
u     cosmix-nodeexport 514  "Cosmix node_exporter (obs tier)"    /nonexistent   /usr/sbin/nologin
