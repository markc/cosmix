# sysusers.d — the two toolsd identities.
#
# cosmix-toolsd-wake : the ABP citizen. Holds NO credential. Its only authority is the
#                      polkit rule permitting `systemctl start cosmix-toolsd-drain`.
# cosmix-toolsd      : the drain. Holds ONE credential (the tools claim secret, delivered
#                      per-run via LoadCredential=). No ssh identity, no PVE reach, no
#                      polkit authority. Its home exists only to give the account a valid,
#                      non-writable-by-others directory — nothing is stored there.
#
# Neither account gets a login shell.
u cosmix-toolsd-wake - "Cosmix toolsd ABP wake citizen" - /usr/sbin/nologin
u cosmix-toolsd      - "Cosmix toolsd drain"            /var/lib/cosmix-toolsd /usr/sbin/nologin
