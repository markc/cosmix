[package]
name = "cosmix-clip-bevy"
version = "0.1.0"
description = "Bevy/CTK clipboard panel for the ABP Bus"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[package.metadata.cosmix]
kind = "app"
component = "clip-bevy"
display = "CosMix Clip (bevy)"
engine = "bevy"

[dependencies]
bevy = { version = "=0.19.0", default-features = false, features = ["ui", "bevy_feathers", "accesskit_unix"] }
ctk = { version = "=0.54.4", path = "../../ctk", features = ["bus", "theme", "system-clipboard"] }
cosmix-client = { package = "cosmix-lib-client", path = "../../../crates/cosmix-lib-client" }
flume = "0.11"
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
