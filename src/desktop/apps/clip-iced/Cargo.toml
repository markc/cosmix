[package]
name = "cosmix-clip-iced"
version = "0.1.0"
description = "CosMix Clipboard — iced toolkit comparison port"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[package.metadata.cosmix]
kind = "app"
component = "clip-iced"
display = "CosMix Clip (iced)"
engine = "iced"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland", "x11", "fira-sans"] }
cosmix-client = { package = "cosmix-lib-client", path = "../../../crates/cosmix-lib-client" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rand = "0.8"
