[package]
name = "term-native-test-broker"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[dependencies]
cosmix_bus = { package = "cosmix-lib-bus", path = "../../../../../crates/cosmix-lib-bus" }
cosmix_client = { package = "cosmix-lib-client", path = "../../../../../crates/cosmix-lib-client" }
cosmix_config = { package = "cosmix-lib-config", path = "../../../../../crates/cosmix-lib-config" }
cosmix_mesh = { package = "cosmix-lib-mesh", path = "../../../../../crates/cosmix-lib-mesh" }
cosmix_mesh_trust = { package = "cosmix-lib-mesh-trust", path = "../../../../../crates/cosmix-lib-mesh-trust", default-features = false }
cosmix_props = { package = "cosmix-lib-props-store", path = "../../../../../crates/cosmix-lib-props-store" }
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../../../../../crates/cosmix-lib-buildinfo" }
anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
libc = "0.2"
notify = "7"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
zeroize = "1"
