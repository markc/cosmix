[package]
name = "cosmix-term"
version = "0.2.4"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "CosMix Wayland terminal on iced + wgpu (lightweight frontend; banded tiny-skia behind a feature)"

[[bin]]
name = "term"
path = "src/main.rs"

# The global Bus name `term` and the `term.*` verb namespace belong to this
# frontend (TODO-term D1, 2026-09-21); the Bevy one is `bterm` / `bterm.*`.
# Neither is registered yet — T2 is the render loop and the weight budget, and
# the verb surface is T6.
[package.metadata.cosmix]
kind = "app"
component = "term"
display = "CosMix Term"
engine = "iced"

[features]
# Default renderer: wgpu (Mark, 2026-09-25, TODO-term T16). tiny-skia was the
# default for a morning (sweep decision 28: ~57-63 MB PSS and 0 GEM against
# wgpu's ~43 MB PSS + 113-121 MB GEM) and typing under Claude Code was
# "almost unusable". The headless benchmark (src/cpu_bench.rs,
# docs/dev/term-rendering.md) at 2250x1250 px: a full-pane redraw costs
# ~23 ms on tiny-skia, of which ~5 ms is glyph painting both arms share and
# ~18 ms is CPU image conversion + blit that wgpu does on the GPU. Banding
# cut a one-row echo from 17.8 to 6.7 ms but cannot make a full-screen TUI
# redraw fit a 16.7 ms frame. Mark's rule: speed skia up first, default to
# wgpu if it is still needed — it is.
default = ["wgpu"]
# The shader-widget path: one persistent wgpu texture, damage-band uploads.
# `naga27-termcolor` rides along: see that dependency for why iced-on-wgpu
# cannot share a build with Bevy without it.
wgpu = ["iced/wgpu", "naga27-termcolor"]
# iced's CPU rasteriser into `wl_shm`, banded (src/cpu_bands.rs): no DRM fd
# at all, like foot, and cheap for sparse updates. Build it ALONE —
# `--no-default-features --features tiny-skia` — because with both compiled
# in, main.rs takes the wgpu grid and iced_renderer puts wgpu first.
tiny-skia = ["iced/tiny-skia", "iced/image", "dep:bytes"]
# Not meant to be selected on its own; `wgpu` pulls it in. It exists as a
# feature so the compatibility dependency stays optional.
naga27-termcolor = ["dep:naga27"]

[build-dependencies]
cosmix-buildinfo = { package = "cosmix-lib-buildinfo", path = "../../../crates/cosmix-lib-buildinfo" }

[dependencies]
bytes = { version = "1.12", optional = true }
# iced 0.14 (D3), its own winit/Wayland backend (D2). default-features off is
# not tidiness: `x11`, `tiny-skia`, `fira-sans` and the theme-detection D-Bus
# client are all dead weight in a Wayland-only terminal that renders a texture
# and draws no iced text, and the binary budget is 25 MB (T5).
iced = { version = "=0.14.0", default-features = false, features = [
    "advanced",
    "crisp",
    "thread-pool",
    "wayland",
] }
# PTY, VT grid, damage-rect raster, config, `--version`. No Wayland, no Bevy.
cosmix-term-core = { path = "../../crates/cosmix-term-core" }
# Every colour on screen that is not the VT's own comes from here (mandatory
# theming, Mark 2026-09-18). `compiler` resolves the embedded default design.
cosmix-design = { path = "../../crates/cosmix-design", features = ["compiler"] }
cosmix-iced-widgets = { path = "../../crates/cosmix-iced-widgets" }
cosmix-buildinfo = { package = "cosmix-lib-buildinfo", path = "../../../crates/cosmix-lib-buildinfo" }
libc = "0.2.189"
serde_json = "1"
# Only for the completion-note channel `cosmix_term_core::bus::start` takes;
# the core already links tokio, so this adds no crate to the graph.
tokio = { version = "1", default-features = false, features = ["sync"] }
# NOT a dependency this crate calls — a feature-unification fix, and the whole
# reason iced-on-wgpu and Bevy can share one workspace.
#
# Bevy reaches `naga_oil 0.22`, which depends on `codespan-reporting 0.12` with
# DEFAULT features, so `termcolor` is on for that package. iced 0.14 reaches
# `naga 27`, which depends on the same package with `default-features = false`.
# naga 27 picks its diagnostic buffer by its OWN `termcolor` feature
# (naga-27.0.3/src/error.rs:64): off it writes into a `String`, on it writes
# into `NoColor<Vec<u8>>`. Cargo unions features across dependents but does not
# propagate a dependency's features back into its dependants, so naga 27 was
# compiled expecting `String` while codespan had been switched to termcolor's
# `WriteColor` — and any build selecting both Bevy and iced-with-wgpu died with
# "the trait bound `String: WriteColor` is not satisfied", inside naga, naming
# nothing of ours.
#
# Enabling naga 27's own `termcolor` aligns the two halves. `NoColor` means no
# escape codes are produced; this buys compilability, not coloured output.
#
# Retire this when iced moves to wgpu 29 (TODO-term D3's iced 0.15 question, at
# T3): naga 27 leaves the graph and takes the conflict with it.
naga27 = { package = "naga", version = "27", default-features = false, features = ["termcolor"], optional = true }

[dev-dependencies]
# Tests compile this dependency even with the default wgpu renderer. Its
# softbuffer dependency needs a platform backend independently of iced's arm.
iced_tiny_skia = { version = "=0.14.1", default-features = false, features = ["image", "wayland"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
