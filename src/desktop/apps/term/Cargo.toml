[package]
name = "cosmix-term"
version = "0.8.6"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Native CosMix Wayland terminal with CTK menus"

[[bin]]
name = "term"
path = "src/main.rs"

[package.metadata.cosmix]
kind = "app"
component = "term"
display = "CosMix Term"
engine = "bevy"

[build-dependencies]
cosmix-buildinfo = { package = "cosmix-lib-buildinfo", path = "../../../crates/cosmix-lib-buildinfo" }

[dependencies]
bevy = { version = "=0.19.0", default-features = false, features = ["ui_api", "ui_bevy_render", "bevy_feathers", "accesskit_unix"] }
# `bus` carries the ctk app-control port (AppPortPlugin: app.describe / app.quit)
# term serves beside its verified native-session lane, for generic same-node
# app lifecycle control that every ctk app shares.
ctk = { path = "../../ctk", features = ["bus", "actions"] }
cosmix-actions = { path = "../../../crates/cosmix-actions" }
cosmix-buildinfo = { package = "cosmix-lib-buildinfo", path = "../../../crates/cosmix-lib-buildinfo" }
# PTY, grid, tabs, raster, Bus and native-session control: everything but Bevy.
cosmix-term-core = { path = "../../crates/cosmix-term-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync"] }
cosmix-app-identity = { path = "../../../crates/cosmix-app-identity" }

[dev-dependencies]
cosmix-config = { package = "cosmix-lib-config", path = "../../../crates/cosmix-lib-config" }
cosmix-term-core = { path = "../../crates/cosmix-term-core", features = ["test-support"] }
term-native-test-broker = { path = "../../crates/cosmix-term-core/tests/support" }
