[package]
name = "cosmix-quoin-demo"
version = "0.1.0"
description = "Development harness for the Cosmix Quoin shell"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[[bin]]
name = "cosmix-quoin-demo"
path = "src/main.rs"

[dependencies]
bevy = { version = "=0.19.0", default-features = false, features = [
    "ui",
    "bevy_feathers",
    "accesskit_unix",
    "wayland",
    "x11",
] }
cosmix-shell = { path = "../../crates/cosmix-shell", default-features = false, features = ["dev-host"] }
ctk = { path = "../../ctk", default-features = false }
