[package]
name = "cosmix-quoin"
version = "0.12.4"
description = "Cosmix Quoin four-edge layer-shell furniture"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
default-run = "cosmix-quoin"

[features]
default = []
scene-gates = ["cosmix-scene-bevy/gate"]
# Mounts scenes loaded with `adapter: iced` through cosmix-scene-iced, drawn by iced
# (tiny-skia). `scene-iced-standin` keeps the bridge's stand-in renderer instead.
scene-iced = ["scene-iced-standin", "cosmix-scene-iced/iced"]
scene-iced-standin = ["dep:cosmix-scene-iced"]
demo = ["cosmix-shell/dev-host"]

[[bin]]
name = "cosmix-quoin"
path = "src/main.rs"

[[bin]]
name = "cosmix-quoin-demo"
path = "src/demo.rs"
required-features = ["demo"]

[dependencies]
cosmix-scene-bevy = { path = "../../crates/cosmix-scene-bevy" }
cosmix-scene = { path = "../../crates/cosmix-scene" }
cosmix-scene-iced = { path = "../../crates/cosmix-scene-iced", optional = true }
bevy = { version = "=0.19.0", default-features = false, features = [
    "ui_api",
    "ui_bevy_render",
    "scene",
    "picking",
    "bevy_ui_widgets",
    "std",
    "bevy_gilrs",
    "bevy_winit",
    "bevy_clipboard",
    "default_font",
    "multi_threaded",
    "webgl2",
    "custom_cursor",
    "sysinfo_plugin",
    "bevy_feathers",
    "accesskit_unix",
    "wayland",
] }
cosmix-shell = { path = "../../crates/cosmix-shell", default-features = false, features = ["chrome"] }
cosmix-shell-host = { path = "../../crates/cosmix-shell-host" }
cosmix-buildinfo = { package = "cosmix-lib-buildinfo", path = "../../../crates/cosmix-lib-buildinfo" }
cosmix-props-core = { package = "cosmix-lib-props-core", path = "../../../crates/cosmix-lib-props-core", features = ["bus"] }
ctk = { path = "../../ctk", default-features = false, features = ["bus"] }
serde_json = "1"
cosmix-config = { package = "cosmix-lib-config", path = "../../../crates/cosmix-lib-config" }
tempfile = "3"

[dev-dependencies]
# The driverless bridge + peer used by `bus_service`'s App-level tests. Only
# the dev targets enable it (Cargo's v2+ resolver does not unify
# dev-dependency features into `cargo build`), so no shipped binary links it.
ctk = { path = "../../ctk", default-features = false, features = ["bus", "test-support"] }

[build-dependencies]
cosmix-buildinfo = { package = "cosmix-lib-buildinfo", path = "../../../crates/cosmix-lib-buildinfo" }
