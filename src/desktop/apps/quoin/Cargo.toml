[package]
name = "cosmix-quoin"
version = "0.4.0"
description = "Cosmix Quoin four-edge layer-shell furniture"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
default-run = "cosmix-quoin"

[features]
default = []
demo = ["cosmix-shell/dev-host"]

[[bin]]
name = "cosmix-quoin"
path = "src/main.rs"

[[bin]]
name = "cosmix-quoin-demo"
path = "src/demo.rs"
required-features = ["demo"]

[dependencies]
bevy = { version = "=0.19.0", default-features = false, features = [
    "ui_api",
    "ui_bevy_render",
    "scene",
    "picking",
    "bevy_ui_widgets",
    "std",
    "bevy_gilrs",
    "bevy_winit",
    "bevy_clipboard",
    "default_font",
    "multi_threaded",
    "webgl2",
    "custom_cursor",
    "sysinfo_plugin",
    "bevy_feathers",
    "accesskit_unix",
    "wayland",
] }
cosmix-shell = { path = "../../crates/cosmix-shell", default-features = false, features = ["chrome"] }
cosmix-shell-host = { path = "../../crates/cosmix-shell-host" }
ctk = { path = "../../ctk", default-features = false }
