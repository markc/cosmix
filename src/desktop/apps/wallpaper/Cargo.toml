[package]
name = "cosmix-wallpaper"
version = "0.2.0"
description = "Native Bevy flocking background for Cosmix"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
cosmix-bg-showcase = { path = "../bg-showcase" }
bevy = { version = "=0.19.0", default-features = false, features = ["std", "2d_api", "2d_bevy_render", "multi_threaded", "wayland", "png"] }
cosmix-shell-host = { path = "../../crates/cosmix-shell-host" }
cosmix-flock = { path = "../../crates/cosmix-flock" }
cosmix-bus = { package = "cosmix-lib-bus", path = "../../../crates/cosmix-lib-bus" }
ctk = { path = "../../ctk", default-features = false, features = ["bus"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
cosmix-buildinfo = { package = "cosmix-lib-buildinfo", path = "../../../crates/cosmix-lib-buildinfo" }

[build-dependencies]
cosmix-buildinfo = { package = "cosmix-lib-buildinfo", path = "../../../crates/cosmix-lib-buildinfo" }

[dev-dependencies]
ctk = { path = "../../ctk", default-features = false, features = ["bus", "test-support"] }
