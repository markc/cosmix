[package]
name = "cosmix-busviewer"
version = "0.1.1"
description = "CTK service browser and verb caller for the ABP Bus"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[package.metadata.cosmix]
kind = "app"
component = "busviewer"
display = "BusViewer"
engine = "bevy"

[[bin]]
name = "cosmix-busviewer"
path = "src/main.rs"

[dependencies]
bevy = { version = "=0.19.0", default-features = false, features = ["ui", "bevy_feathers", "accesskit_unix"] }
ctk = { version = "=0.55.2", path = "../../ctk", features = ["bus", "theme", "system-clipboard"] }
cosmix-client = { package = "cosmix-lib-client", path = "../../../crates/cosmix-lib-client" }
flume = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
