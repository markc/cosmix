# desktop/apps/wl-iced-demo — test B of the one-GUI-toolkit ADR.
#
# Two binaries from one package: `wl-raw-demo` is cosmix-wl-app alone (a
# plain grid, a popup menu, IME and clipboard); `wl-iced-demo` adds iced
# chrome on top of the same raw code. The difference between the two is what
# iced costs term.
[package]
name = "cosmix-wl-iced-demo"
version = "0.1.0"
description = "Raw Wayland demo clients for cosmix-wl-app, without and with iced chrome"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "wl-raw-demo"
path = "src/bin/wl-raw-demo.rs"

# Build it in its own cargo invocation with `--features iced`; building
# wl-raw-demo without the feature keeps iced out of its graph.
[[bin]]
name = "wl-iced-demo"
path = "src/bin/wl-iced-demo.rs"
required-features = ["iced"]

[features]
iced = ["dep:cosmix-iced-host", "dep:cosmix-iced-widgets"]

[dependencies]
cosmix-iced-host = { path = "../../crates/cosmix-iced-host", features = ["xkb"], optional = true }
cosmix-iced-widgets = { path = "../../crates/cosmix-iced-widgets", features = ["tiny-skia"], optional = true }
cosmix-wl-app = { path = "../../crates/cosmix-wl-app" }
rustix = { version = "1", features = ["param", "time"] }
swash = "0.2.10"
