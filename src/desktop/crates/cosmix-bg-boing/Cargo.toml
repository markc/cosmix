[package]
name = "cosmix-bg-boing"
version = "0.1.0"
description = "Shared Boing scene geometry and isolated Avian physics"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
avian3d = { version = "=0.7.0", default-features = false, features = ["3d", "f32", "parry-f32"] }
bevy = { version = "=0.19.0", default-features = false, features = ["std", "bevy_log", "bevy_pbr", "tonemapping_luts", "ktx2", "zstd_rust"] }
