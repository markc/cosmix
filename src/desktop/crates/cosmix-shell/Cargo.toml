[package]
name = "cosmix-shell"
version = "0.1.0"
description = "Pure core and host seams for the Cosmix Quoin desktop shell"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[features]
default = []
chrome = ["dep:accesskit", "dep:bevy", "dep:ctk"]
dev-host = ["chrome"]

[dependencies]
accesskit = { version = "0.24", optional = true }
bevy = { version = "=0.19.0", default-features = false, features = ["ui", "bevy_feathers", "bevy_winit"], optional = true }
ctk = { path = "../../ctk", default-features = false, optional = true }
