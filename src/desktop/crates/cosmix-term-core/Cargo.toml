[package]
name = "cosmix-term-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Renderer-free core of CosMix Term: PTY, VT grid, tabs/panes, CPU raster, Bus and native-session control"

# No Bevy and no Wayland. A frontend owns the window, feeds input in, and
# renders from `Terminal::grid_snapshot` when `wake::WakeFd` fires.
[dependencies]
cosmix-client = { package = "cosmix-lib-client", path = "../../../crates/cosmix-lib-client" }
cosmix-config = { package = "cosmix-lib-config", path = "../../../crates/cosmix-lib-config", features = ["client-helpers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync"] }
# FD handoff patch, drift guard and upstream-PR exit: ../../README.teletypewriter-patch.md.
# The guard reads these two lines; keep each dependency on one line.
rio-vt = { git = "https://github.com/raphamorim/rio", rev = "932c1a7d9e07b4db5924f7a0dd689e823c3a1442", default-features = false, features = ["pty"] }
teletypewriter = { git = "https://github.com/raphamorim/rio", rev = "932c1a7d9e07b4db5924f7a0dd689e823c3a1442", default-features = false }
swash = "0.2.10"
libc = "0.2.189"
cosmix-bus = { package = "cosmix-lib-bus", path = "../../../crates/cosmix-lib-bus" }
ed25519-dalek = { version = "2", features = ["zeroize"] }
zeroize = "1"
sha2 = "0.10"
cosmix_buildinfo = { package = "cosmix-lib-buildinfo", path = "../../../crates/cosmix-lib-buildinfo" }

[dev-dependencies]
term-native-test-broker = { path = "tests/support" }
