[package]
name = "cosmix-scene-iced"
version = "0.2.0"
description = "Mix Scenes adapter drawing through a CPU surface renderer into a persistent Bevy texture"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
bevy = { version = "=0.19.0", default-features = false, features = ["ui_api", "bevy_render", "bevy_ui_widgets", "bevy_feathers", "png"] }
cosmix-scene = { path = "../cosmix-scene" }
cosmix-scene-bevy = { path = "../cosmix-scene-bevy" }
cosmix-shell = { path = "../cosmix-shell", features = ["chrome"] }
serde_json = "1"

[dev-dependencies]
ctk = { path = "../../ctk", default-features = false, features = ["bus", "test-support"] }
