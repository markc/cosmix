[package]
name = "cosmix-iced-widgets"
version = "0.1.0"
description = "Shared Cosmix iced text fields, menus and design token adapter"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[features]
default = []
wgpu = ["iced/wgpu"]
tiny-skia = ["iced/tiny-skia"]
gallery = ["iced/fira-sans"]
gallery-wgpu = ["gallery", "wgpu"]
gallery-tiny-skia = ["gallery", "tiny-skia"]

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "wayland", "thread-pool"] }
cosmix-design = { path = "../cosmix-design", default-features = false }

[dev-dependencies]
iced_runtime = { version = "=0.14.0", default-features = false }

[[example]]
name = "gallery"
required-features = ["gallery"]
