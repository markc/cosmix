[package]
name = "cosmix-iced-widgets"
version = "0.1.0"
description = "Shared Cosmix iced widgets: text field, menus, pro-audio controls, waveform, piano roll, design tokens"
edition = "2024"
rust-version = "1.95"
license = "MIT"

# The library uses iced's component crates only. The `iced` umbrella always
# links iced_winit and winit, so it is reachable solely through the gallery
# features, for the example.
[features]
default = []
wgpu = ["iced_renderer/wgpu", "iced_renderer/geometry"]
tiny-skia = ["iced_renderer/tiny-skia", "iced_renderer/geometry"]
gallery = ["dep:iced"]
gallery-wgpu = ["gallery", "wgpu", "iced/wgpu"]
gallery-tiny-skia = ["gallery", "tiny-skia", "iced/tiny-skia"]

[dependencies]
iced_core = { git = "https://github.com/iced-rs/iced", rev = "0e911834a42a749197758a52885935ce31c0322e", default-features = false, features = ["advanced"] }
iced_widget = { git = "https://github.com/iced-rs/iced", rev = "0e911834a42a749197758a52885935ce31c0322e", default-features = false, features = ["advanced"] }
iced_graphics = { git = "https://github.com/iced-rs/iced", rev = "0e911834a42a749197758a52885935ce31c0322e", default-features = false, features = ["geometry"] }
iced_renderer = { git = "https://github.com/iced-rs/iced", rev = "0e911834a42a749197758a52885935ce31c0322e", default-features = false }
cosmix-design = { path = "../cosmix-design", default-features = false }
iced = { git = "https://github.com/iced-rs/iced", rev = "0e911834a42a749197758a52885935ce31c0322e", default-features = false, optional = true, features = ["advanced", "canvas", "wayland", "thread-pool", "fira-sans"] }

[dev-dependencies]
iced_runtime = { git = "https://github.com/iced-rs/iced", rev = "0e911834a42a749197758a52885935ce31c0322e", default-features = false }

[[example]]
name = "gallery"
required-features = ["gallery"]
