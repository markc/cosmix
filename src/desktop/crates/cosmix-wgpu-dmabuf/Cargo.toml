[package]
name = "cosmix-wgpu-dmabuf"
version = "0.12.0"
description = "DMA-BUF to Bevy/wgpu bridge for the CosMix compositor"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
ash = "=0.38.0"
bevy = { version = "=0.19.0", default-features = false, features = [
    "bevy_asset",
    "bevy_image",
    "bevy_render",
    "bevy_sprite_render",
] }
drm-fourcc = "=2.2.0"
libc = "0.2"
thiserror = "2"
tracing = "0.1"
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "vulkan"] }
wgpu-hal = "=29.0.4"
wgpu-types = "=29.0.4"

[dev-dependencies]
wgpu = { version = "=29.0.4", features = ["noop"] }
