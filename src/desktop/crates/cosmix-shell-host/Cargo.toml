[package]
name = "cosmix-shell-host"
version = "0.3.0"
description = "SCTK layer-shell renderer host for Cosmix Quoin"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
bevy = { version = "=0.19.0", default-features = false, features = [
    # Bevy's `ui` convenience feature includes `default_platform`, hence X11.
    # Spell out the same UI/platform surface with Wayland as the sole backend.
    "ui_api",
    "ui_bevy_render",
    "scene",
    "picking",
    "bevy_ui_widgets",
    "std",
    "bevy_gilrs",
    "bevy_clipboard",
    "default_font",
    "multi_threaded",
    "webgl2",
    "custom_cursor",
    "sysinfo_plugin",
    "bevy_feathers",
    "bevy_winit",
    "wayland",
] }
bevy_winit = { version = "=0.19.1", default-features = false, features = ["wayland"] }
calloop = { version = "=0.13.0", features = ["signals"] }
cosmix-client = { package = "cosmix-lib-client", path = "../../../crates/cosmix-lib-client" }
cosmix-config = { package = "cosmix-lib-config", path = "../../../crates/cosmix-lib-config", features = ["client-helpers"] }
cosmix-shell = { path = "../cosmix-shell", default-features = false, features = ["chrome"] }
raw-window-handle = "=0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "=0.19.2", default-features = false, features = ["calloop", "xkbcommon"] }
tracing = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
wayland-client = "=0.31.14"
wayland-backend = { version = "=0.3.15", features = ["client_system"] }
wayland-protocols = { version = "=0.32.13", default-features = false, features = ["client", "staging"] }
winit = { version = "=0.30.13", default-features = false, features = ["wayland"] }
xkbcommon = "=0.7.0"
xkbcommon-dl = "=0.4.2"

[dev-dependencies]
pretty_assertions = "1"
