[package]
name = "cosmix-comp"
version = "0.35.0"
description = "Smithay protocol frontend with Bevy rendering for the CosMix desktop"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[features]
default = ["bus", "frame-capture"]
bus = [
    "dep:cosmix-buildinfo",
    "dep:cosmix-bus",
    "dep:cosmix-client",
    "dep:cosmix-config",
    "dep:cosmix-props-core",
    "dep:chrono",
    "dep:crossbeam-channel",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
]
explicit-sync-live-test = []
frame-capture = ["dep:signal-hook"]
kms-live = [
    "dep:signal-hook",
    "dep:smithay-client-toolkit",
    "dep:wayland-client",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cosmix_kms_live_release)'] }

[[bin]]
name = "cosmix-comp"
path = "src/main.rs"

[[bin]]
name = "cosmix-lock-probe"
path = "src/bin/cosmix-lock-probe.rs"
required-features = ["kms-live"]

[dependencies]
bevy = { version = "=0.19.0", default-features = false, features = [
    "2d_bevy_render",
    "bevy_winit",
    "default_app",
    "default_font",
    "multi_threaded",
    "std",
    "system_font_discovery",
    "wayland",
    "x11",
] }
cosmix-deco = { path = "../cosmix-deco" }
cosmix-wgpu-dmabuf = { path = "../cosmix-wgpu-dmabuf" }
cosmix-buildinfo = { package = "cosmix-lib-buildinfo", path = "../../../crates/cosmix-lib-buildinfo", optional = true }
cosmix-bus = { package = "cosmix-lib-bus", path = "../../../crates/cosmix-lib-bus", default-features = false, optional = true }
cosmix-client = { package = "cosmix-lib-client", path = "../../../crates/cosmix-lib-client", optional = true }
cosmix-config = { package = "cosmix-lib-config", path = "../../../crates/cosmix-lib-config", features = ["client-helpers"], optional = true }
cosmix-props-core = { package = "cosmix-lib-props-core", path = "../../../crates/cosmix-lib-props-core", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
crossbeam-channel = { version = "0.5", optional = true }
getrandom = "0.4"
# Not called directly: `system_font_discovery` reaches fontconfig through
# Parley, and without this feature the binary carries `NEEDED
# libfontconfig.so.1` — a host missing that library is killed by the dynamic
# loader before `main`, which no in-process typography fallback can survive.
# `dlopen` moves the lookup to runtime, so a missing fontconfig degrades to no
# system fonts instead of an app that cannot start. Cargo unifies features
# across the graph, so declaring it here applies to Parley's copy.
fontique = { version = "0.9", default-features = false, features = [
    "fontconfig-dlopen",
] }
libc = "0.2"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
signal-hook = { version = "0.3", optional = true }
smithay-client-toolkit = { version = "=0.19.2", default-features = false, features = [
    "calloop",
], optional = true }
serde = { version = "1", features = ["derive", "rc"], optional = true }
serde_json = { version = "1", optional = true }
smithay = { version = "=0.7.0", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "desktop",
    "wayland_frontend",
] }
drm-fourcc = "=2.2.0"
static_assertions = "1"
tracing = "0.1"
unicode-segmentation = "1"
wayland-client = { version = "=0.31.14", optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"], optional = true }

[build-dependencies]
cosmix-buildinfo = { package = "cosmix-lib-buildinfo", path = "../../../crates/cosmix-lib-buildinfo" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wgpu = { version = "=29.0.4", features = ["noop"] }
