[package]
name = "cosmix-iced-host"
version = "0.1.5"
description = "Headless, windowing-agnostic iced host rendering into caller-owned CPU buffers"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[features]
xkb = ["dep:xkbcommon"]

# The `iced` umbrella crate depends on iced_winit (and so winit) unconditionally,
# so the host takes the iced component crates directly. tiny-skia is the only
# renderer: `iced_renderer/tiny-skia` without `wgpu` makes it the default
# `iced_widget` renderer. iced_tiny_skia always compiles softbuffer, which
# fails to build on Linux with no backend, so its dlopen'd Wayland presenter is
# enabled; this crate never calls it and nothing links libwayland for it.
[dependencies]
iced_core = { git = "https://github.com/iced-rs/iced", rev = "0e911834a42a749197758a52885935ce31c0322e" }
iced_graphics = { git = "https://github.com/iced-rs/iced", rev = "0e911834a42a749197758a52885935ce31c0322e" }
iced_renderer = { git = "https://github.com/iced-rs/iced", rev = "0e911834a42a749197758a52885935ce31c0322e", default-features = false, features = ["tiny-skia"] }
iced_runtime = { git = "https://github.com/iced-rs/iced", rev = "0e911834a42a749197758a52885935ce31c0322e" }
iced_tiny_skia = { git = "https://github.com/iced-rs/iced", rev = "0e911834a42a749197758a52885935ce31c0322e", default-features = false, features = ["wayland"] }
iced_widget = { git = "https://github.com/iced-rs/iced", rev = "0e911834a42a749197758a52885935ce31c0322e", default-features = false }
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }
xkbcommon = { version = "=0.7.0", default-features = false, optional = true }
